name: Release

# Publishes a Windows installer to GitHub Releases when a version tag is pushed.
# Bump the version in package.json, commit, then: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # electron-builder needs write access to create the GitHub Release + assets.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        run: pnpm run release
        env:
          # electron-builder authenticates to the GitHub Releases API with this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
